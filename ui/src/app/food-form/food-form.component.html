<section hlmCard class="w-full dark max-w-2xl mx-auto p-4 flex flex-col">
  <!-- Encabezado del formulario -->
  <div hlmCardHeader class="flex-shrink-0">
    <h2 hlmCardTitle>{{ isEditMode ? 'Editar' : 'Crear' }} Comida</h2>
    <p hlmCardDescription>
      Completa los detalles de la comida.
    </p>
  </div>

  <!-- Contenedor scrollable para el contenido del formulario -->
  <div class="flex-grow overflow-y-auto">
    <form [formGroup]="foodForm" (ngSubmit)="onSubmit()">
      <p hlmCardContent class="pb-0">
        <!-- Campo de Nombre -->
        <label class="block my-4" hlmLabel>
          Nombre
          <input class="mt-1.5 w-full" id="name" formControlName="name" hlmInput required
            placeholder="Ingrese el nombre de la comida" />
          @if (foodForm.get('name')?.invalid && foodForm.get('name')?.touched) {
          <small>El nombre es obligatorio.</small>
          }
        </label>

        <!-- Tipo -->
        <label class="block my-4" hlmLabel>
          Tipo
          <brn-select class="block mt-1.5" placeholder="Seleccione un tipo" formControlName="type" [multiple]="false">
            <hlm-select-trigger class="w-56">
              <hlm-select-value />
            </hlm-select-trigger>
            <hlm-select-content>
              <hlm-option value="ENTRADA">Entrada</hlm-option>
              <hlm-option value="PLATO PRINCIPAL">Plato principal</hlm-option>
              <hlm-option value="POSTRE">Postre</hlm-option>
              <hlm-option value="BEBIDA">Bebida</hlm-option>
              <hlm-option value="OTRO">Otro</hlm-option>
            </hlm-select-content>
          </brn-select>

          @if (foodForm.get('type')?.invalid && foodForm.get('type')?.touched) {
          <small>El tipo es obligatorio.</small>
          }
        </label>

        <!-- isVegetaian checkbox -->
        <label class="flex items-center" hlmLabel>
          <hlm-checkbox class="mr-2" id="isVegetarian" formControlName="isVegetarian" required />
          Es vegetariano
        </label>
      </p>

      <!-- Botones de pie de página -->
      <div hlmCardFooter class="flex-shrink-0 flex justify-between mt-4">
        <button type="button" hlmBtn variant="secondary" (click)="onCancel()">Cancelar</button>
        <button type="submit" hlmBtn [disabled]="!foodForm.valid">
          Guardar Comida
        </button>
      </div>
    </form>
  </div>


</section>
